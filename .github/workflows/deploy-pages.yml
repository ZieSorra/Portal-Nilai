name: Deploy ZIESORRA to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --input-type=module --check < src/app.js
          node --input-type=module --check < src/config.js
          node --input-type=module --check < src/session.js
          node --input-type=module --check < src/quotes.js

      - name: Verify static assets
        run: |
          test -f src/index.html
          test -f src/styles.css
          test -f src/portal-ui.css
          test -f src/assets/favicon.svg

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -R src/. _site/
          if [ -d assets ]; then cp -R assets _site/assets; fi
          # Preserve a repository-level GitHub Pages custom-domain file when configured.
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Deployment trigger: publish the current main branch.
